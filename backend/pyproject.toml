[project]
name = "flir-research-interface"
version = "0.0.1"
description = "FLIR A50/A70 radiometric acquisition, recording, and analysis backend"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "psutil>=5.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "zarr>=2.18,<3",
    "numcodecs>=0.13,<0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
# PySpin is NOT on PyPI. Install the wheel from the Spinnaker SDK download that
# matches your OS/architecture/Python version. See docs/installation.md.

[project.scripts]
fri-probe = "flir_research_interface.probe:main"
fri-sdk-check = "flir_research_interface.sdk_install:main"
fri-live = "flir_research_interface.validation:main"
fri-rtsp-check = "flir_research_interface.visible.rtsp:main"
fri-serve = "flir_research_interface.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flir_research_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "hardware: requires a physical FLIR camera and PySpin (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
